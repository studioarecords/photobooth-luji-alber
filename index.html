<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>📸 Cumple Luji & Alber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100dvh;
            background: #000;
            color: white;
            overflow: hidden;
            font-family: system-ui, sans-serif;
        }
        #video, #preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #camera-screen { display: flex; }
        #btn-take {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #f44336;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 10;
        }
        #btn-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 16px;
            z-index: 10;
            cursor: pointer;
        }
        .preview-buttons {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
            padding: 0 20px;
            z-index: 10;
        }
        .preview-btn {
            padding: 12px 24px;
            font-size: 17px;
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            max-width: 150px;
        }
        #btn-upload { background: #4CAF50; }
        #btn-retake { background: #616161; }
        #status {
            position: absolute;
            bottom: 110px;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            z-index: 10;
        }
        #title {
            position: absolute;
            top: 12px;
            width: 100%;
            text-align: center;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        #canvas { display: none; }
    </style>
</head>
<body>
    <!-- Pantalla de cámara -->
    <div id="camera-screen" class="screen">
        <div id="title">🎉 ¡Toma tu foto en el Cumple de Luji & Alber!</div>
        <video id="video" autoplay playsinline muted></video>
        <button id="btn-switch">🔄 Cámara</button>
        <button id="btn-take"></button>
        <div id="status">Accediendo a la cámara...</div>
    </div>

    <!-- Pantalla de vista previa -->
    <div id="preview-screen" class="screen">
        <img id="preview-img" src="" />
        <div class="preview-buttons">
            <button id="btn-retake" class="preview-btn">🔄 Retomar</button>
            <button id="btn-upload" class="preview-btn">📤 Subir</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const previewImg = document.getElementById('preview-img');
        const statusEl = document.getElementById('status');

        const cameraScreen = document.getElementById('camera-screen');
        const previewScreen = document.getElementById('preview-screen');

        const btnTake = document.getElementById('btn-take');
        const btnSwitch = document.getElementById('btn-switch');
        const btnRetake = document.getElementById('btn-retake');
        const btnUpload = document.getElementById('btn-upload');

        let stream = null;
        let currentFacingMode = 'environment'; // trasera
        let photoBase64 = null;

        // Iniciar cámara
        async function initCamera() {
            try {
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                }
                const constraints = {
                    video: { facingMode: { exact: currentFacingMode } }
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                statusEl.textContent = currentFacingMode === 'user' 
                    ? '✅ Cámara frontal activa' 
                    : '✅ Cámara trasera activa';
                statusEl.style.color = '#81c784';
            } catch (err) {
                statusEl.textContent = '❌ Error: ' + (err.message || 'acceso denegado');
                statusEl.style.color = '#e57373';
                console.error('Error cámara:', err);
            }
        }

        // Alternar cámara
        btnSwitch.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            initCamera();
        });

        // Tomar foto
        btnTake.addEventListener('click', () => {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            photoBase64 = dataUrl.split(',')[1]; // solo base64
            previewImg.src = dataUrl; // ✅ Esto SÍ muestra la imagen

            cameraScreen.style.display = 'none';
            previewScreen.style.display = 'flex';
        });

        // Retomar
        btnRetake.addEventListener('click', () => {
            cameraScreen.style.display = 'flex';
            previewScreen.style.display = 'none';
            photoBase64 = null;
        });

        // Subir a Google Drive
        btnUpload.addEventListener('click', async () => {
            if (!photoBase64) return;

            statusEl.textContent = '⏳ Subiendo...';
            statusEl.style.color = 'white';
            statusEl.style.display = 'block';

            try {
                const response = await fetch(
                    'https://script.google.com/macros/s/AKfycbyUaLdGD7ojxx1nL_iDeoUVGxpasLIVX2w53rp0V9CbIN4DqYg12MGQdB0snYUGtQGAIw/exec',
                    {
                        method: 'POST',
                        body: photoBase64
                    }
                );
                const result = await response.json();

                if (result.success) {
                    statusEl.innerHTML = `✅ ¡Foto guardada!<br><a href="${result.url}" target="_blank" style="color:#81c784;">Ver foto</a>`;
                    setTimeout(() => {
                        cameraScreen.style.display = 'flex';
                        previewScreen.style.display = 'none';
                        photoBase64 = null;
                    }, 3000);
                } else {
                    throw new Error(result.error || 'Error desconocido');
                }
            } catch (err) {
                statusEl.textContent = '❌ Error: ' + err.message;
                statusEl.style.color = '#e57373';
                console.error('Error subida:', err);
            }
        });

        // Iniciar al cargar
        window.addEventListener('load', () => {
            initCamera();
        });
    </script>
</body>
</html>
